# ============================================================
# 跌倒检测系统配置文件
# 面向低算力端侧平台基于视觉的实时跌倒检测
# ============================================================

# --- 模型配置 ---
model:
  name: "LightSpatialTemporalFallDetector"
  version: "large"  # standard / light / large
  
  # Motion Feature Encoder
  motion_encoder:
    feature_dim: 48
    frame_window: 3
  
  # Light-TCN
  tcn:
    version: "v1"          # v1 (标准) / v2 (深度可分离)
    hidden_dim: 64
    num_layers: 5
    kernel_size: 3
    dilations: [1, 2, 4, 8, 16]
    dropout: 0.1
  
  # Rule Refinement
  rule:
    torso_angle_threshold: 0.5       # 弧度 ≈ 30°
    torso_angle_duration: 8
    velocity_peak_threshold: 0.03   # 跟踪器修复后重新标定：跌倒 0.09-0.16，慢速远距跌倒 0.032，缓慢坐地尖峰 0.028
    stillness_threshold: 0.005
    stillness_duration: 15
    vote_window: 10
    vote_threshold: 0.6
    recovery_duration: 5
    tcn_prob_threshold: 0.3        # 2000视频重训后类间分离改善：ADL max 0.29-0.30、fall-05 0.49，0.3 阈值下 4/4 全对
    aspect_ratio_change_threshold: 0.2  # 从 0.3 降到 0.2（增强框形态变化敏感度）
    fall_memory_frames: 60
    rules_min_pass: 1              # 物理规则至少通过1条 (事件合并窗口已修复，不会重复计数)

# --- 检测器配置 ---
detector:
  model: "yolov8n-pose.pt"   # YOLOv8n-pose 模型路径
  device: "cpu"              # cpu / cuda / npu
  input_size: [640, 384]     # [width, height]
  conf_threshold: 0.15
  iou_threshold: 0.7
  kp_conf_threshold: 0.3
  max_det: 5

# --- 跟踪器配置 ---
tracker:
  track_thresh: 0.5
  match_thresh: 0.8
  second_match_thresh: 0.5
  track_buffer: 30
  frame_rate: 30

# --- 推理管线配置 ---
pipeline:
  model_version: "large"   # application checkpoint architecture
  sequence_length: 32
  detection_interval: 2      # YOLO 检测间隔（隔N帧）
  video_detection_interval: 1 # 上传视频逐帧检测，避免跌倒阶段被隔帧漏掉
  video_model: "yolo11m-pose.pt"  # 上传视频采用更强姿态模型；摄像头仍用 n 版
  video_input_size: [1280, 736]
  video_device: "cuda"       # 无 CUDA 时自动回退 CPU
  video_cpu_threads: 2
  camera_detection_interval: 1  # 实时模式逐帧检测，保证每帧都有新框和骨架
  camera_input_size: [512, 288]  # 摄像头预览使用较小输入，上传视频仍用上面的尺寸
  camera_device: "cuda"     # 有 NVIDIA GPU 时摄像头使用 CUDA；无 GPU 自动回退 CPU
  camera_width: 1280
  camera_height: 720
  camera_fps: 30
  # 720p30 要在设置分辨率之后请求 MJPEG，否则驱动可能回到 720p8 YUY2。
  # 优先保证真实曝光：固定 -5 在室内严重欠曝，软件提亮会形成灰雾。
  # 自动曝光在暗处可能降低实际 FPS，以状态中的实测值为准。
  camera_backend: "dshow"
  camera_auto_exposure: 0.75
  camera_exposure: null       # 仅显式手动模式下才写入曝光值
  camera_preview_brightness: 100
  camera_jpeg_quality: 90
  camera_cpu_threads: 2
  ir_mode: false             # 红外模式
  pose_recovery: true        # 上传视频启用局部放大、旋转及有界高分辨率重识别
  camera_pose_recovery: false  # 摄像头只做快速主检测，避免每帧额外局部推理
  camera_transition_max_gap_seconds: 1.5  # 实时推理较慢时，允许同一轨迹短暂丢检后继续比较真实姿态
  camera_preserve_short_gaps_seconds: 1.2 # 按真实时间限定历史保留；丢失与残缺骨架统一超时，不填充伪造帧
  camera_model_support_grace_seconds: 1.2 # 真实跌倒过渡后，容忍实时TCN短暂降分
  transition_max_gap_seconds: 0.6         # 上传视频使用严格连续观测
  require_observed_transition: true  # 真实姿态变化 + 持续低位 + TCN支持，排除开头已躺卧
  video_min_kp_completeness: 0.35   # 离线视频允许跌倒阶段的部分骨架进入时序分析
  camera_min_kp_completeness: 0.5   # 实时摄像头保持较严格的骨架质量门控
  # 应用层报警策略：连续疑似跌倒 0.5 秒后触发，人工确认或 30 秒后解除
  camera_id: "laptop_camera"
  alarm_trigger_seconds: 0.5
  alarm_hold_seconds: 30.0
  alarm_cooldown_frames: 30  # 兼容旧脚本，不再作为报警保持时间
  save_video: false
  output_dir: "output"

# --- 训练配置 ---
training:
  data_dir: "data/train"
  val_dir: "data/val"
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: "cosine"     # cosine / step / plateau
  warmup_epochs: 5
  early_stopping: 15
  gradient_clip: 1.0
  sequence_length: 32
  stride: 8
  use_augmentation: true
  
  # 损失权重
  loss:
    bce_weight: 1.0
    focal_alpha: 0.25
    focal_gamma: 2.0
  
  # 保存
  save_dir: "checkpoints"
  log_interval: 10
  eval_interval: 1

# --- 数据增强配置 ---
augmentation:
  ir_prob: 0.3
  erase_prob: 0.3
  perspective_prob: 0.2
  blur_prob: 0.2
  lowlight_prob: 0.3
  jitter_std: 0.01
  drop_prob: 0.1

# --- 部署配置 ---
deployment:
  export_format: "onnx"      # onnx / torchscript / mindir
  precision: "fp16"          # fp32 / fp16 / int8
  target_npu: "ascend310"    # ascend310 / rk3588 / generic
  max_batch_size: 1
  dynamic_axes: true

# --- 赛题合规检查 ---
compliance:
  max_params: 20000000       # 20M
  max_model_size_mb: 80      # 80MB FP32
  max_latency_ms: 100        # 100ms
  max_npu_memory_mb: 20      # 20MB
