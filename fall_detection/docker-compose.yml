services:
  mysql:
    image: mysql:8.4
    container_name: fall-detection-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fall_detection
      MYSQL_USER: fall_user
      MYSQL_PASSWORD: fall_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - fall_detection_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fall_detection_mysql:
